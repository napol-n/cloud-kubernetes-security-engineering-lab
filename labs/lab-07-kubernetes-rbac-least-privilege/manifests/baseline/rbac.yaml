apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab07-app-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab07-overprivileged
  namespace: default
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - delete

  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab07-overprivileged-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: lab07-app-sa
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab07-overprivileged
